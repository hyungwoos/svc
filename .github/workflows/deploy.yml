# 테스트 통과 → GitHub Pages 배포 (실패하면 라이브 사이트는 이전 버전 그대로)
#   · 저장소 Settings › Pages › Source 가 «GitHub Actions» 여야 이 워크플로가 배포를 맡습니다(테스트를 통과한 버전만 라이브로)
#   · main 에 커밋될 때마다 실행 (포탈 «배포·운영» 의 커밋·승격 포함) · Actions 탭에서 수동 실행도 가능
#   · 2026-10-04 갱신(㊿+143): 실행 환경을 ubuntu-24.04 로 고정(ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀜) ·
#     Node 22 · 액션은 Node 24 로 도는 최신 주 버전 · 함수 테스트 실패를 «|| echo» 로 덮지 않음
#   · 2026-10-05 갱신(㊿+147): 테스트 잡에 ESLint 정적 검사(tests/lint.mjs) 단계 추가 — 파일이 루트에 없으면(승격 전) 건너뜀
#   · 이 파일은 포탈로 커밋할 수 없습니다(포탈 토큰에 Workflows 권한 없음) — GitHub 웹에서 직접 편집
name: test-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: 정적 검사 (문법 · 비밀값 · fixture · 규칙)
        run: node tests/check.mjs
      - name: Playwright 설치
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: 정적 검사 2 (ESLint · 파일 간 전역 이름 지도 — 오타·없는 이름·중복 선언)
        # 스테이징 커밋은 tests/*.mjs 를 staging/tests/ 에 두고 «승격» 때 루트로 옮김 → 승격 전엔 루트에 lint.mjs 가 없을 수 있어 그땐 건너뜀
        run: |
          if [ -f tests/lint.mjs ]; then node tests/lint.mjs
          else echo "건너뜀 — tests/lint.mjs 가 아직 루트에 없음(스테이징 커밋 뒤 승격 전). 승격하면 다음 실행부터 검사합니다"; fi
      - name: 스모크 테스트 (가짜 백엔드 · 운영 DB 접근 없음)
        run: node tests/smoke.mjs
      - name: 실패 화면 보관
        if: failure()
        uses: actions/upload-artifact@v6
        with: { name: smoke-out, path: tests/out, if-no-files-found: ignore }
  functions:
    # Edge Function(supabase/functions/*) 타입 검사 + 가짜 외부 서비스로 동작 테스트 · 견적 Worker 테스트 — 운영 DB·토큰 접근 없음
    # 소스나 테스트가 아직 루트에 없으면 그 항목만 건너뜀(이유를 로그에 남김). 있으면 실패가 그대로 실패로 보고됨
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: 타입 검사 (저장소에 있는 함수만 — ask 소스는 업무 지식이 들어 있어 공개 저장소에 두지 않음)
        run: |
          shopt -s nullglob; n=0
          for f in supabase/functions/*/index.ts; do echo "== deno check $f"; deno check "$f"; n=$((n+1)); done
          echo "checked: $n"
      - name: 함수·Worker 테스트
        run: |
          run_t() {
            if [ -f "$1" ] && [ -f "$2" ]; then echo "== $2"; deno run -A "$2"
            else echo "건너뜀 — $1 또는 $2 가 저장소 루트에 없음"; fi
          }
          run_t supabase/functions/ops/index.ts      tests/fn/ops.test.ts
          run_t supabase/functions/remind/index.ts   tests/fn/remind.test.ts
          run_t supabase/functions/aicheck/index.ts  tests/fn/aicheck.test.ts
          run_t cloudflare/quote-worker/worker.js    tests/fn/quote-worker.test.ts
  deploy:
    needs: [test, functions]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: 사이트 묶기 (테스트·설정·개발용 파일 제외)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'node_modules' --exclude '_site' \
                   --exclude 'package.json' --exclude 'package-lock.json' --exclude '*.md' --exclude 'sql*.sql' \
                   --exclude 'supabase' --exclude 'cloudflare' --exclude '*.mjs' --exclude '*.ts' \
                   ./ _site/
          echo "files: $(find _site -type f | wc -l)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v5
